modules:
  jira:issuePanel:
    - key: shipguard-iac-panel
      resource: panel
      resolver:
        function: resolver
      title: ShipGuard IaC
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      tooltip: Scan and verify LLM repairs for Terraform and Kubernetes

  rovo:agent:
    - key: shipguard-agent
      name: ShipGuard IaC
      description: Scans Terraform/Kubernetes misconfigurations and keeps only
        verified LLM fixes.
      prompt: resource:agent-resource;agent-prompt.txt
      conversationStarters:
        - Scan this Terraform for security issues
        - Suggest a verified fix for my Kubernetes Pod
        - Create a Jira issue for a finding that needs a human
      actions:
        - scan-iac
        - suggest-verified-fix
        - create-finding-issue

  action:
    - key: scan-iac
      name: Scan IaC
      function: scanIac
      actionVerb: GET
      description: Scan pasted Terraform or Kubernetes YAML and return security findings.
      inputs:
        content:
          title: IaC content
          type: string
          required: true
          description: Full Terraform or Kubernetes file contents to scan
        filename:
          title: Filename
          type: string
          required: false
          description: Optional filename hint such as main.tf or deployment.yaml

    - key: suggest-verified-fix
      name: Suggest verified fix
      function: suggestVerifiedFix
      actionVerb: CREATE
      description: Propose an LLM repair and keep it only if the verifier and re-scan agree.
      inputs:
        content:
          title: IaC content
          type: string
          required: true
          description: Full Terraform or Kubernetes file contents to repair
        filename:
          title: Filename
          type: string
          required: false
          description: Optional filename hint such as main.tf or pod.yaml

    - key: create-finding-issue
      name: Create finding issue
      function: createFindingIssue
      actionVerb: CREATE
      description: Create a Jira Task for an IaC finding that needs a human decision.
      inputs:
        ruleId:
          title: Rule ID
          type: string
          required: true
          description: ShipGuard rule identifier
        title:
          title: Finding title
          type: string
          required: true
          description: Short title of the finding
        resource:
          title: Resource
          type: string
          required: false
          description: Terraform address or Kubernetes object name
        detail:
          title: Detail
          type: string
          required: false
          description: Extra context for the assignee
        projectKey:
          title: Project key
          type: string
          required: true
          description: Jira project key where the Task should be created

  function:
    - key: resolver
      handler: resolver.handler
    - key: scanIac
      handler: rovoActions.scanIac
    - key: suggestVerifiedFix
      handler: rovoActions.suggestVerifiedFix
    - key: createFindingIssue
      handler: rovoActions.createFindingIssue

resources:
  - key: panel
    path: static/panel/build
  - key: agent-resource
    path: prompts

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
  external:
    fetch:
      backend:
        - address: api.groq.com

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/386463f9-2d34-4331-9cae-e436fadc9190
